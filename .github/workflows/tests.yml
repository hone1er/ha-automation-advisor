name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.9.4"          # oldest supported
            python: "3.13"
            phacc: "0.13.281"
            frontend: "20250903.5"
            extra: "'pycares<5'"
          - ha: "2026.10.4"
            python: "3.14"
            phacc: "0.13.375"
            frontend: "20260930.5"
            extra: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}" \
            "home-assistant-frontend==${{ matrix.frontend }}" ollama ${{ matrix.extra }}
      - name: Test
        run: python -m pytest tests -q
